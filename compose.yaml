name: coffee-monitoring

services:
  # API кофейни: принимает заказы и отдаёт /metrics.
  api:
    build: ./app
    image: coffee-monitoring/api:1.0.0       # явный тег вместо latest
    environment:
      SLOW_MODE: ${SLOW_MODE:-0}     # опыт: SLOW_MODE=1 docker compose up -d api
    ports:
      - "127.0.0.1:8030:8000"
    restart: unless-stopped

  # Pushgateway: сюда короткая задача daily_report отправляет метрики (push).
  pushgateway:
    image: prom/pushgateway:v1.11.1
    ports:
      - "127.0.0.1:9098:9091"
    restart: unless-stopped

  # Prometheus: сам опрашивает api, pushgateway и себя (pull).
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      # Какой файл настроек читать — задаётся переменной PROM_CONFIG.
      # По умолчанию рабочий prometheus.yml; для опыта — oshibki.yml.
      - --config.file=/etc/prometheus/${PROM_CONFIG:-prometheus.yml}
      - --storage.tsdb.path=/prometheus
      # Разрешает POST /-/reload: перечитать настройки без перезапуска.
      - --web.enable-lifecycle
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9097:9090"
    depends_on:
      - api
      - pushgateway
    restart: unless-stopped

  # Grafana: строит графики, спрашивая Prometheus на PromQL.
  grafana:
    image: grafana/grafana:12.1.1
    environment:
      # Анонимный просмотр с ролью Viewer — ТОЛЬКО для учебного стенда.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/coffee.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3017:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  # Ночной отчёт: короткая задача. Не стартует при `docker compose up`
  # (профиль jobs), запускается вручную: docker compose run --rm report_job
  report_job:
    build: ./report_job
    image: coffee-monitoring/report-job:1.0.0
    environment:
      PUSHGATEWAY_URL: pushgateway:9091
    depends_on:
      - pushgateway
    profiles: ["jobs"]

volumes:
  prometheus-data:
  grafana-data:

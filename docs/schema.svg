<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="a-pull" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-push" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
    </marker>
    <marker id="a-user" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52525b"/>
    </marker>
    <marker id="a-in" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- фон -->
  <rect width="1200" height="860" fill="#ffffff"/>

  <!-- заголовок -->
  <text x="40" y="44" font-size="24" font-weight="700" fill="#18181b">Кофейня под наблюдением: кто кого опрашивает</text>
  <text x="40" y="70" font-size="14" fill="#52525b">Prometheus сам забирает метрики (pull). Единственное место push — короткая задача report_job → Pushgateway.</text>

  <!-- ===== компьютер (слева) ===== -->
  <text x="40" y="112" font-size="13" font-weight="700" fill="#52525b" letter-spacing="0.5">ВАШ КОМПЬЮТЕР</text>

  <rect x="40" y="170" width="190" height="96" rx="10" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.5"/>
  <text x="135" y="200" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">load/load.py</text>
  <text x="135" y="222" font-size="12.5" fill="#3f3f46" text-anchor="middle">normal · rush · bad</text>
  <text x="135" y="242" font-size="12.5" fill="#3f3f46" text-anchor="middle">или curl</text>

  <rect x="40" y="560" width="190" height="96" rx="10" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.5"/>
  <text x="135" y="592" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">Браузер</text>
  <text x="135" y="614" font-size="12.5" fill="#3f3f46" text-anchor="middle">дашборд Grafana,</text>
  <text x="135" y="634" font-size="12.5" fill="#3f3f46" text-anchor="middle">Prometheus и Pushgateway</text>

  <rect x="40" y="340" width="190" height="74" rx="10" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.5"/>
  <text x="135" y="368" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">Терминал</text>
  <text x="135" y="390" font-size="12.5" fill="#3f3f46" text-anchor="middle">docker compose logs api</text>

  <!-- ===== сеть Docker ===== -->
  <rect x="290" y="96" width="880" height="690" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="312" y="122" font-size="13" font-weight="700" fill="#475569" letter-spacing="0.5">СЕТЬ DOCKER «coffee-monitoring» · контейнеры видят друг друга по имени сервиса</text>

  <!-- ===== API ===== -->
  <rect x="320" y="146" width="380" height="330" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="320" y="146" width="380" height="40" rx="12" fill="#dcfce7"/>
  <rect x="320" y="172" width="380" height="14" fill="#dcfce7"/>
  <text x="340" y="172" font-size="16" font-weight="700" fill="#14532d">api</text>
  <text x="378" y="172" font-size="13" fill="#166534">FastAPI · контейнер :8000 · target «api:8000»</text>

  <!-- main.py -->
  <rect x="340" y="200" width="340" height="64" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="354" y="222" font-size="14" font-weight="700" fill="#14532d">main.py</text>
  <text x="354" y="241" font-size="12" fill="#3f3f46">маршруты + middleware: считает HTTP-запросы</text>
  <text x="354" y="257" font-size="12" fill="#3f3f46">и длительность, выдаёт request_id, пишет лог</text>

  <!-- worker.py -->
  <rect x="340" y="288" width="160" height="78" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="354" y="310" font-size="14" font-weight="700" fill="#14532d">worker.py</text>
  <text x="354" y="329" font-size="12" fill="#3f3f46">очередь ≤ 50</text>
  <text x="354" y="346" font-size="12" fill="#3f3f46">6 бариста готовят</text>
  <text x="354" y="361" font-size="12" fill="#3f3f46">3 % — поломка</text>

  <!-- metrics.py -->
  <rect x="520" y="288" width="160" height="78" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="534" y="310" font-size="14" font-weight="700" fill="#4c1d95">metrics.py</text>
  <text x="534" y="329" font-size="12" fill="#3f3f46">CollectorRegistry</text>
  <text x="534" y="346" font-size="12" fill="#3f3f46">7 метрик: 3 counter,</text>
  <text x="534" y="361" font-size="12" fill="#3f3f46">2 histogram, 2 gauge</text>

  <!-- связи внутри api -->
  <line x1="420" y1="264" x2="420" y2="286" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a-user)"/>
  <text x="428" y="280" font-size="11" fill="#166534">заказ в очередь</text>
  <path d="M 600 264 L 600 286" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-in)"/>
  <text x="608" y="280" font-size="11" fill="#6d28d9">.inc() .observe()</text>
  <line x1="500" y1="327" x2="518" y2="327" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#a-in)"/>

  <!-- адреса API -->
  <rect x="340" y="384" width="340" height="74" rx="8" fill="#fafafa" stroke="#d4d4d8"/>
  <text x="354" y="404" font-size="12" font-weight="700" fill="#3f3f46">Адреса</text>
  <text x="354" y="423" font-size="12" fill="#3f3f46" font-family="Menlo, Consolas, monospace">POST /orders · GET /orders/{order_id}</text>
  <text x="354" y="441" font-size="12" fill="#3f3f46" font-family="Menlo, Consolas, monospace">/menu · /health · <tspan font-weight="700" fill="#1d4ed8">/metrics</tspan></text>
  <text x="354" y="455" font-size="10.5" fill="#71717a">/metrics/slow — только для опыта oshibki.yml</text>

  <!-- ===== Prometheus ===== -->
  <rect x="820" y="146" width="320" height="160" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="820" y="146" width="320" height="40" rx="12" fill="#dbeafe"/>
  <rect x="820" y="172" width="320" height="14" fill="#dbeafe"/>
  <text x="840" y="172" font-size="16" font-weight="700" fill="#1e3a8a">prometheus</text>
  <text x="944" y="172" font-size="13" fill="#1d4ed8">v3.5.0 · :9090</text>
  <rect x="1072" y="157" width="56" height="20" rx="4" fill="#18181b"/>
  <text x="1100" y="171" font-size="11" fill="#ffffff" text-anchor="middle" font-family="Menlo, Consolas, monospace">:9097</text>
  <text x="840" y="210" font-size="12.5" fill="#3f3f46">scrape_interval 15s · scrape_timeout 10s</text>
  <text x="840" y="230" font-size="12.5" fill="#3f3f46">хранит историю (TSDB), отвечает на PromQL</text>
  <text x="840" y="254" font-size="12" font-weight="700" fill="#1e3a8a">jobs:</text>
  <text x="878" y="254" font-size="12" fill="#3f3f46" font-family="Menlo, Consolas, monospace">coffee-api · pushgateway</text>
  <text x="878" y="272" font-size="12" fill="#3f3f46" font-family="Menlo, Consolas, monospace">prometheus</text>
  <text x="840" y="294" font-size="11.5" fill="#71717a">добавляет метки job, instance, env и пишет up</text>

  <!-- self-scrape -->
  <path d="M 1100 146 C 1100 112, 1160 112, 1140 160" stroke="#2563eb" stroke-width="1.8" fill="none" marker-end="url(#a-pull)"/>
  <text x="1040" y="138" font-size="11" fill="#1d4ed8" text-anchor="end">себя: localhost:9090</text>

  <!-- ===== Pushgateway ===== -->
  <rect x="820" y="420" width="320" height="104" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="820" y="420" width="320" height="40" rx="12" fill="#dbeafe"/>
  <rect x="820" y="446" width="320" height="14" fill="#dbeafe"/>
  <text x="840" y="446" font-size="16" font-weight="700" fill="#1e3a8a">pushgateway</text>
  <text x="956" y="446" font-size="13" fill="#1d4ed8">v1.11.1 · :9091</text>
  <rect x="1072" y="431" width="56" height="20" rx="4" fill="#18181b"/>
  <text x="1100" y="445" font-size="11" fill="#ffffff" text-anchor="middle" font-family="Menlo, Consolas, monospace">:9098</text>
  <text x="840" y="484" font-size="12.5" fill="#3f3f46">хранит последнее присланное значение</text>
  <text x="840" y="504" font-size="12.5" fill="#3f3f46">группа job="daily_report"</text>

  <!-- ===== report_job ===== -->
  <rect x="820" y="640" width="320" height="104" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="840" y="668" font-size="16" font-weight="700" fill="#7c2d12">report_job</text>
  <text x="940" y="668" font-size="12.5" fill="#9a3412">живёт 2–5 с и завершается</text>
  <text x="840" y="690" font-size="12.5" fill="#3f3f46">docker compose run --rm report_job</text>
  <text x="840" y="710" font-size="12" fill="#3f3f46">coffee_daily_report_last_success_timestamp_seconds,</text>
  <text x="840" y="727" font-size="12" fill="#3f3f46">_duration_seconds, _orders</text>

  <!-- ===== Grafana ===== -->
  <rect x="320" y="560" width="380" height="140" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <rect x="320" y="560" width="380" height="40" rx="12" fill="#fef3c7"/>
  <rect x="320" y="586" width="380" height="14" fill="#fef3c7"/>
  <text x="340" y="586" font-size="16" font-weight="700" fill="#78350f">grafana</text>
  <text x="416" y="586" font-size="13" fill="#92400e">12.1.1 · :3000</text>
  <text x="340" y="624" font-size="12.5" fill="#3f3f46">источник данных и дашборд — из файлов provisioning</text>
  <text x="340" y="644" font-size="12.5" fill="#3f3f46">«Кофейня · заказы»: 6 панелей, обновление 10 с</text>
  <text x="340" y="664" font-size="12.5" fill="#3f3f46">не хранит метрики — каждый раз спрашивает Prometheus</text>
  <text x="340" y="686" font-size="11.5" fill="#71717a">анонимный просмотр, роль Viewer</text>

  <!-- ===== стрелки ===== -->

  <!-- PULL: prometheus → api /metrics -->
  <line x1="818" y1="226" x2="704" y2="226" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a-pull)"/>
  <rect x="712" y="190" width="100" height="30" rx="4" fill="#f8fafc"/>
  <text x="762" y="203" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">GET /metrics</text>
  <text x="762" y="217" font-size="11" fill="#1d4ed8" text-anchor="middle">каждые 15 с</text>
  <text x="762" y="244" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">PULL</text>

  <!-- PULL: prometheus → pushgateway -->
  <line x1="980" y1="308" x2="980" y2="416" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a-pull)"/>
  <text x="992" y="350" font-size="12" font-weight="700" fill="#1d4ed8">GET /metrics · PULL</text>
  <text x="992" y="368" font-size="11.5" fill="#1d4ed8">honor_labels: true —</text>
  <text x="992" y="384" font-size="11.5" fill="#1d4ed8">job="daily_report" сохраняется</text>

  <!-- PUSH: report_job → pushgateway -->
  <line x1="980" y1="638" x2="980" y2="528" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#a-push)"/>
  <text x="992" y="578" font-size="12" font-weight="700" fill="#c2410c">PUSH · push_to_gateway()</text>
  <text x="992" y="596" font-size="11.5" fill="#c2410c">единственное место push</text>

  <!-- PromQL: grafana → prometheus -->
  <path d="M 702 600 L 760 600 L 760 290 L 816 290" stroke="#52525b" stroke-width="2.2" fill="none" marker-end="url(#a-user)"/>
  <rect x="712" y="420" width="96" height="40" rx="4" fill="#f8fafc"/>
  <text x="760" y="436" font-size="12" font-weight="700" fill="#3f3f46" text-anchor="middle">PromQL</text>
  <text x="760" y="452" font-size="11" fill="#3f3f46" text-anchor="middle">rate, p95, up</text>

  <!-- пользователь → api -->
  <line x1="232" y1="218" x2="316" y2="218" stroke="#52525b" stroke-width="2.2" marker-end="url(#a-user)"/>
  <rect x="244" y="188" width="62" height="20" rx="4" fill="#18181b"/>
  <text x="275" y="202" font-size="11" fill="#ffffff" text-anchor="middle" font-family="Menlo, Consolas, monospace">:8030</text>
  <text x="260" y="236" font-size="11" fill="#52525b" text-anchor="middle">заказы</text>

  <!-- браузер → grafana -->
  <line x1="232" y1="608" x2="316" y2="608" stroke="#52525b" stroke-width="2.2" marker-end="url(#a-user)"/>
  <rect x="244" y="578" width="62" height="20" rx="4" fill="#18181b"/>
  <text x="275" y="592" font-size="11" fill="#ffffff" text-anchor="middle" font-family="Menlo, Consolas, monospace">:3017</text>



  <!-- логи api → терминал -->
  <path d="M 318 377 L 234 377" stroke="#7c3aed" stroke-width="1.8" fill="none" marker-end="url(#a-in)"/>
  <text x="262" y="369" font-size="11" fill="#6d28d9" text-anchor="middle">JSON-логи</text>
  <text x="262" y="394" font-size="11" fill="#6d28d9" text-anchor="middle">stdout</text>

  <!-- ===== легенда ===== -->
  <g transform="translate(40, 812)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a-pull)"/>
    <text x="50" y="4" font-size="12.5" fill="#3f3f46">pull: Prometheus сам приходит за метриками</text>
    <line x1="340" y1="0" x2="380" y2="0" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#a-push)"/>
    <text x="390" y="4" font-size="12.5" fill="#3f3f46">push: задача сама отправляет итог</text>
    <line x1="640" y1="0" x2="680" y2="0" stroke="#52525b" stroke-width="2.2" marker-end="url(#a-user)"/>
    <text x="690" y="4" font-size="12.5" fill="#3f3f46">запросы людей и Grafana</text>
    <rect x="880" y="-10" width="46" height="20" rx="4" fill="#18181b"/>
    <text x="903" y="4" font-size="11" fill="#ffffff" text-anchor="middle" font-family="Menlo, Consolas, monospace">:8030</text>
    <text x="934" y="4" font-size="12.5" fill="#3f3f46">порт на 127.0.0.1</text>
  </g>
</svg>
